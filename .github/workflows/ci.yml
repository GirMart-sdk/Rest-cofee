name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-server:
    name: Lint Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostal-cofre/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hostal-cofre/server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  lint-client:
    name: Lint Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostal-cofre/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hostal-cofre/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: lint-server
    defaults:
      run:
        working-directory: hostal-cofre/server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hostal_cofee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hostal_cofee_test?schema=public
      JWT_SECRET: ci-test-secret-that-is-at-least-32-chars-long
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hostal-cofre/server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:coverage

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    needs: lint-client
    defaults:
      run:
        working-directory: hostal-cofre/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hostal-cofre/client/package-lock.json
      - run: npm ci
      - run: npm run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test-server, test-client]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hostal_cofee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hostal_cofee_test?schema=public
      JWT_SECRET: ci-test-secret-that-is-at-least-32-chars-long
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGIN: http://localhost:3001
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: AdminTest123!
      CLIENT_EMAIL: client@test.local
      CLIENT_PASSWORD: ClientTest123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            hostal-cofre/server/package-lock.json
            hostal-cofre/client/package-lock.json
            package-lock.json
      - name: Install root deps (Playwright)
        run: npm ci
      - name: Install server deps
        working-directory: hostal-cofre/server
        run: npm ci
      - name: Install client deps
        working-directory: hostal-cofre/client
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Migrate and seed
        working-directory: hostal-cofre/server
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: Start server (Vite middleware on :3001)
        working-directory: hostal-cofre/server
        run: |
          nohup npx tsx src/index.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Server is up after ${i} tries"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3001/api/health || { echo "Server failed to start"; cat /tmp/server.log; exit 1; }
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-server, lint-client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Server
        working-directory: hostal-cofre/server
        run: |
          npm ci
          npm run build
      - name: Build Client
        working-directory: hostal-cofre/client
        run: |
          npm ci
          npm run build
