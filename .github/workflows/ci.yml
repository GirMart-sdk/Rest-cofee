name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-server:
    name: Lint Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostal-cofre/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hostal-cofre/server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  lint-client:
    name: Lint Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostal-cofre/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hostal-cofre/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: lint-server
    defaults:
      run:
        working-directory: hostal-cofre/server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hostal_cofee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hostal_cofee_test?schema=public
      JWT_SECRET: test-secret-min-32-characters-long-enough
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hostal-cofre/server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-server, lint-client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Server
        working-directory: hostal-cofre/server
        run: |
          npm ci
          npm run build
      - name: Build Client
        working-directory: hostal-cofre/client
        run: |
          npm ci
          npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-server, build]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        working-directory: hostal-cofre
        run: |
          docker compose build
