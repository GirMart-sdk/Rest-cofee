name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Principio de menor privilegio: el GITHUB_TOKEN solo necesita leer el repo.
permissions:
  contents: read

# Cancela runs anteriores del mismo ref para ahorrar minutos y evitar condiciones de carrera.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-server:
    name: Lint Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hostal-cofre/server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hostal-cofre/server/package-lock.json
      - run: npm ci
      - name: Audit de dependencias (falla si hay high/critical)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check

  lint-client:
    name: Lint Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hostal-cofre/client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hostal-cofre/client/package-lock.json
      - run: npm ci
      - name: Audit de dependencias (falla si hay high/critical)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: lint-server
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hostal-cofre/server
    services:
      postgres:
        image: postgres:16-alpine@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
        env:
          POSTGRES_DB: hostal_cofee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hostal_cofee_test?schema=public
      JWT_SECRET: ci-test-secret-that-is-at-least-32-chars-long
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hostal-cofre/server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:coverage

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    needs: lint-client
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hostal-cofre/client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hostal-cofre/client/package-lock.json
      - run: npm ci
      - run: npm run test

  security-test:
    name: Security Tests (HTTP)
    runs-on: ubuntu-latest
    needs: lint-server
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
        env:
          POSTGRES_DB: hostal_cofee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hostal_cofee_test?schema=public
      JWT_SECRET: ci-e2e-4f9c0b3a7d1e2f8a9b6c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGIN: http://localhost:3001
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: AdminTest123!
      CLIENT_EMAIL: client@test.local
      CLIENT_PASSWORD: ClientTest123!
    defaults:
      run:
        working-directory: hostal-cofre/server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hostal-cofre/server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Seed database
        run: npm run db:seed
      - name: Start server (Vite middleware on :3001)
        run: |
          nohup npx tsx src/index.ts > /tmp/security-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Server is up after ${i} tries"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3001/api/health || { echo "Server failed to start"; cat /tmp/security-server.log; exit 1; }
      - name: Run security tests
        run: npm run test:security

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test-server, test-client]
    timeout-minutes: 30    services:
      postgres:
        image: postgres:16-alpine@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
        env:
          POSTGRES_DB: hostal_cofee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hostal_cofee_test?schema=public
      JWT_SECRET: ci-test-secret-that-is-at-least-32-chars-long
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGIN: http://localhost:3001
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: AdminTest123!
      CLIENT_EMAIL: client@test.local
      CLIENT_PASSWORD: ClientTest123!
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            hostal-cofre/server/package-lock.json
            hostal-cofre/client/package-lock.json
            package-lock.json
      - name: Install root deps (Playwright)
        run: npm ci
      - name: Install server deps
        working-directory: hostal-cofre/server
        run: npm ci
      - name: Install client deps
        working-directory: hostal-cofre/client
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Migrate and seed
        working-directory: hostal-cofre/server
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: Start server (Vite middleware on :3001)
        working-directory: hostal-cofre/server
        run: |
          nohup npx tsx src/index.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Server is up after ${i} tries"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3001/api/health || { echo "Server failed to start"; cat /tmp/server.log; exit 1; }
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-server, lint-client]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build Server
        working-directory: hostal-cofre/server
        run: |
          npm ci
          npm run build
      - name: Build Client
        working-directory: hostal-cofre/client
        run: |
          npm ci
          npm run build
